<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WatchGen</title>

<style>

body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
}

.home-hero{
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero-bg{
  position: absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit: cover;
  object-position: center;
  z-index:1;
}

.overlay{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background: rgba(0,0,0,0.55);
  z-index:2;
}

.hero-content{
  position: relative;
  z-index:3;
  color:white;
  max-width:700px;
}

.hero-content h1{
  font-size:3.5rem;
  margin-bottom:15px;
}

.hero-content p{
  font-size:1.3rem;
  margin-bottom:25px;
}

.btn{
  padding:12px 25px;
  background:#e50914;
  color:white;
  text-decoration:none;
  border-radius:6px;
  font-size:18px;
  transition:0.3s;
}

.btn:hover{
  background:#b20710;
}

</style>
</head>

<body>

<div class="home-hero">

<img class="hero-bg" src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80" alt="Dinosaur Background">

<div class="overlay"></div>

<div class="hero-content">
<h1>Welcome to WatchGen 🎬</h1>
<p>Get powerful movie recommendations based on your ratings and collaborative preferences — all in one stunning place!</p>
<a class="btn" href="{% url 'choosemovie' %}">Choose a Movie Now</a>
</div>

</div>

</body>
</html>
